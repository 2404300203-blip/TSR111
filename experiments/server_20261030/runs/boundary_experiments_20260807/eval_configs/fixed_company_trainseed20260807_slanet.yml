Architecture:
  Backbone:
    name: PPLCNet
    pretrained: true
    scale: 1.0
    use_ssld: true
  Head:
    hidden_size: 256
    loc_reg_num: 4
    max_text_length: 500
    name: SLAHead
  Neck:
    name: CSPPAN
    out_channels: 96
  algorithm: SLANet
  model_type: table
Eval:
  dataset:
    data_dir: train_data/table/fintabnet_processed/fintabnet_c_company_disjoint_500/
    label_file_list:
    - output/fair_company_disjoint_20260806/seed20260806/heldout.jsonl
    name: PubTabDataSet
    transforms:
    - DecodeImage:
        channel_first: false
        img_mode: BGR
    - TableLabelEncode:
        learn_empty_box: false
        loc_reg_num: 4
        max_text_length: 500
        merge_no_span_structure: true
        replace_empty_cell_token: false
    - TableBoxEncode:
        in_box_format: xyxy
        out_box_format: xyxy
    - ResizeTableImage:
        max_len: 488
    - NormalizeImage:
        mean:
        - 0.485
        - 0.456
        - 0.406
        order: hwc
        scale: 1./255.
        std:
        - 0.229
        - 0.224
        - 0.225
    - PaddingTableImage:
        size:
        - 488
        - 488
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - structure
        - bboxes
        - bbox_masks
        - length
        - shape
  loader:
    batch_size_per_card: 4
    drop_last: false
    num_workers: 0
    shuffle: false
Global:
  amp_custom_white_list:
  - concat
  - elementwise_sub
  - set_value
  box_format: xyxy
  cal_metric_during_train: true
  character_dict_path: ppocr/utils/dict/table_structure_dict.txt
  character_type: en
  checkpoints: output/boundary_experiments_20260807/fixed_company_split20260806/trainseed20260807/slanet/latest
  d2s_train_image_shape:
  - 3
  - -1
  - -1
  epoch_num: 20
  eval_batch_step:
  - 0
  - 99999999
  infer_img: train_data/table/pubtabnet/val/PMC5755158_010_01.png
  infer_mode: false
  log_smooth_window: 20
  max_text_length: 500
  model_name: SLANet
  pretrained_model: null
  print_batch_step: 10
  save_epoch_step: 20
  save_inference_dir: output/boundary_experiments_20260807/fixed_company_split20260806/trainseed20260807/slanet/infer
  save_model_dir: output/boundary_experiments_20260807/fixed_company_split20260806/trainseed20260807/slanet
  save_res_path: output/boundary_experiments_20260807/fixed_company_split20260806/trainseed20260807/slanet/infer
  seed: 20260807
  use_gpu: true
  use_sync_bn: true
  use_visualdl: false
Loss:
  loc_loss: smooth_l1
  loc_weight: 2.0
  name: SLALoss
  structure_weight: 1.0
Metric:
  box_format: xyxy
  compute_bbox_metric: false
  loc_reg_num: 4
  main_indicator: acc
  name: TableMetric
Optimizer:
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  lr:
    decay_epochs:
    - 10
    - 16
    learning_rate: 1.0e-05
    name: Piecewise
    values:
    - 1.0e-05
    - 5.0e-06
    - 1.0000000000000002e-06
  name: Adam
  regularizer:
    factor: 0.0
    name: L2
PostProcess:
  merge_no_span_structure: true
  name: TableLabelDecode
Train:
  dataset:
    data_dir: train_data/table/fintabnet_processed/fintabnet_c_company_disjoint_500/
    label_file_list:
    - output/fair_company_disjoint_20260806/seed20260806/adapt_train.jsonl
    name: PubTabDataSet
    transforms:
    - DecodeImage:
        channel_first: false
        img_mode: BGR
    - TableLabelEncode:
        learn_empty_box: false
        loc_reg_num: 4
        max_text_length: 500
        merge_no_span_structure: true
        replace_empty_cell_token: false
    - TableBoxEncode:
        in_box_format: xyxy
        out_box_format: xyxy
    - ResizeTableImage:
        max_len: 488
    - NormalizeImage:
        mean:
        - 0.485
        - 0.456
        - 0.406
        order: hwc
        scale: 1./255.
        std:
        - 0.229
        - 0.224
        - 0.225
    - PaddingTableImage:
        size:
        - 488
        - 488
    - ToCHWImage: null
    - KeepKeys:
        keep_keys:
        - image
        - structure
        - bboxes
        - bbox_masks
        - length
        - shape
  loader:
    batch_size_per_card: 4
    drop_last: true
    num_workers: 0
    shuffle: true
